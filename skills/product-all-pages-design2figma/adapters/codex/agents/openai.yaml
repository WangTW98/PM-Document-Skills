interface:
  display_name: "Product All Pages Design2Figma"
  short_description: "Create full release sitemap in Figma"
  default_prompt: "Use $product-all-pages-design2figma with my explicit visual-design-spec output and Figma link. Read product/release/product-sitemap-release.md, infer application forms when I do not specify them, create or reuse all product/release/layout release layout components first, then for each sitemap row resolve its unique layout family from product-sitemap-release.md plus all release layout md files and create the release page using only that matched layout family. Enforce a visibility integrity gate, icon resolution, overflow-safe sizing, z-order correctness, a post-write repair loop, and deterministic non-overlapping batch placement so pages do not stack in the same area. Maintain product/release/pages/_design2figma-status.md. If I did not specify the design spec or Figma link, stop and ask."
