name: "product-sitemap-release"
version: "0.4.0"
description: "Generate a confirmed release product overview from the latest sitemap draft by applying A-/Q- release handling decisions, analyzing 用户补充描述, applying those user modifications, and removing uncertainty."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "product/development/product-sitemap-draft.md"
  - "product/development/product-sitemap-draft-v<N>.md"
outputs:
  - "product/release/product-sitemap-release.md"
  - "product/release/product-sitemap-release-blockers.md"
resources:
  references:
    - "references/release-quality-checklist.md"
compatibility:
  runner_neutral: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  source_skill: "product-sitemap-draft"
  draft_update_skill: "product-sitemap-draft-update"
  input_selection_rule: "use explicit draft path when provided; otherwise use highest product-sitemap-draft-v<N>.md, falling back to product-sitemap-draft.md"
  output_release: "product/release/product-sitemap-release.md"
  output_blockers: "product/release/product-sitemap-release-blockers.md"
  must_apply:
    - "all Release 处理方式 values from the final assumption and confirmation list"
    - "all user confirmation results that replace, remove, or confirm draft content"
    - "all non-empty 用户补充描述 natural-language modifications"
  must_remove:
    - "A-* and Q-* references"
    - "assumptions"
    - "open questions"
    - "draft-only confirmation lists"
    - "raw 用户补充描述 section and notes"
    - "uncertainty markers"
  must_preserve:
    - "confirmed product overview"
    - "complete sitemap table"
    - "Mermaid sitemap visualization"
    - "page generation queue"
    - "page-level Markdown paths"
