interface:
  display_name: "Product Pages Design2Figma"
  short_description: "Create selected release pages in Figma"
  default_prompt: "Use $product-pages-design2figma with my explicit visual-design-spec output and Figma link. First create or reuse all product/release/layout release layout components in the target Figma file, then for each selected release page resolve its unique layout family from product-sitemap-release.md plus all release layout md files, and create that page using only the matched layout family. Enforce a visibility integrity gate, explicit parent-child hierarchy, icon resolution, overflow-safe sizing, z-order correctness, and a post-write repair loop so the result has no missing icons, overlap, clipping, or truncated content. If I did not specify the design spec or Figma link, stop and ask."
