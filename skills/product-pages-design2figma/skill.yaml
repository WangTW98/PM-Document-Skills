name: "product-pages-design2figma"
version: "0.1.0"
description: "Create exactly one Figma design from one product/release/design page Markdown file by parsing a user-provided Figma link, resolving the target Figma page, and writing via Figma Remote MCP."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "product/release/design/<page>.md"
  - "product/release/product-overview-release.md"
  - "Figma design URL"
  - "target Figma page name or target node"
  - "optional user-requested application form such as APP, PC web, responsive web, admin console, mini-program, tablet app, or other"
outputs:
  - "Figma page/frame created in the user-provided Figma file"
resources:
  references:
    - "references/figma-target-resolution-checklist.md"
    - "references/design2figma-quality-checklist.md"
compatibility:
  runner_neutral: false
  requires_figma_remote_mcp: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  source_directory: "product/release/design"
  one_page_per_invocation: true
  strict_single_page_execution: true
  requires_figma_link: true
  requires_target_figma_page: true
  target_resolution_required_before_write: true
  application_form_compatibility_required_before_write: true
  downstream_tool: "Figma Remote MCP"
  must_include:
    - "Figma URL parsing"
    - "fileKey extraction"
    - "node-id extraction when present"
    - "target Figma page inspection"
    - "target page disambiguation before writing"
    - "single page MD parsing"
    - "application form determination from user instruction or product overview"
    - "selected page surface inference when the product overview includes multiple application forms"
    - "selected design-system supported-form verification"
    - "blocking before Figma write when the design system does not support the requested/inferred form"
    - "top-level Figma layer naming as <md-file-name> / <page-name-from-md>"
    - "layout integrity audit parsing and enforcement"
    - "Figma node creation from AI-readable style structure"
    - "Auto Layout, sizing, overflow, wrapping, truncation, and layer-order application"
    - "post-write verification"
    - "post-write layout integrity verification"
  must_avoid:
    - "processing more than one page MD per invocation"
    - "directory-level processing"
    - "writing to Figma before target page verification"
    - "writing to Figma before application form compatibility verification"
    - "using a default Figma page when target is ambiguous"
    - "using a PC-only design system to create mobile APP designs"
    - "using an APP-only design system to create PC web/admin/responsive web designs"
    - "treating responsive web support as APP support unless explicitly stated by the design system"
    - "proceeding when multiple application forms are plausible for the selected page and the user has not clarified"
    - "overwriting existing Figma content without explicit user request"
    - "creating interaction prototypes"
    - "creating analytics or tracking layers"
    - "creating API/backend/business workflow artifacts"
    - "using a top-level Figma layer name that does not match <md-file-name> / <page-name-from-md>"
    - "creating from a design MD without a completed layout integrity audit"
    - "leaving unintended overlap, stacking, clipping, squeezed text, hidden controls, ambiguous hierarchy, or incorrect layer order in Figma output"
    - "using absolute positioning for normal layout when Auto Layout and constraints should be used"
