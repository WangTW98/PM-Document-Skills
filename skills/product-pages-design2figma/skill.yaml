name: "product-pages-design2figma"
version: "0.2.0"
description: "Create one or more user-selected release pages in Figma by using an explicit visual-design-spec output, creating or reusing all release layout components first, and then building selected release pages from product/release/pages with strict hierarchy and overflow-safe structure."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "explicit design specification created by visual-design-spec: design/<slug>/DESIGN.md or design/<slug>/"
  - "product/release/product-sitemap-release.md"
  - "product/release/layout/product-layout-release*.md"
  - "one or more selected release pages under product/release/pages"
  - "Figma design URL"
  - "optional explicit application form"
outputs:
  - "layout components created or reused in the target Figma file"
  - "selected release page frames created in the target Figma file"
resources:
  references:
    - "references/figma-target-resolution-checklist.md"
    - "references/design2figma-quality-checklist.md"
compatibility:
  runner_neutral: false
  requires_figma_remote_mcp: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  requires_explicit_visual_design_spec: true
  visual_design_spec_skill: "visual-design-spec"
  canonical_design_file: "design/<slug>/DESIGN.md"
  release_layout_directory: "product/release/layout"
  release_pages_directory: "product/release/pages"
  release_sitemap_file: "product/release/product-sitemap-release.md"
  requires_figma_link: true
  creates_layout_components_before_pages: true
  reuses_existing_layout_components_when_compatible: true
  unique_layout_family_resolution_required_per_page: true
  visibility_integrity_gate_required: true
  icon_resolution_required: true
  post_write_repair_loop_required: true
  completion_requires_zero_critical_visibility_issues: true
  page_name_rule: "<sitemap 页面级MD文件 basename>-<页面ID>-<页面标题>"
  must_include:
    - "stop immediately if design specification is not explicitly provided"
    - "stop immediately if figma link is not provided"
    - "application form inference from product-sitemap-release when user does not specify it"
    - "layout component creation or reuse from all release layout files before page creation"
    - "unique layout family resolution for each page by using product-sitemap-release and all release layout md files"
    - "release page creation from product/release/pages instead of product/release/design"
    - "visibility integrity gate before page creation"
    - "icon resolution gate before icon creation"
    - "post-write verification and repair loop"
    - "explicit parent-child hierarchy"
    - "overflow-safe width/height handling"
    - "layer-order verification"
  must_avoid:
    - "guessing the design specification"
    - "guessing the destination figma file"
    - "creating pages before layout components"
    - "mixing multiple release layout families in one page"
    - "using index.md as the unique page frame prefix"
    - "creating flat loose layers without explicit container nesting"
    - "silently dropping icons"
    - "leaving unresolved overlap, clipping, or truncation at completion time"
    - "allowing overlap, clipping, hidden controls, or broken z-order"
