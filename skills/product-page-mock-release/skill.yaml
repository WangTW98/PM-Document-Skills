name: "product-page-mock-release"
version: "0.2.0"
description: "Generate exactly one confirmed content-only mock release Markdown file from one product/development/mock page per execution, applying MA-/MQ- release handling, analyzing 用户补充描述, applying those user modifications, and removing all assumptions/open questions."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "product/development/mock/<page>.md"
outputs:
  - "product/release/mock/<page>.md"
resources:
  references:
    - "references/page-mock-release-quality-checklist.md"
compatibility:
  runner_neutral: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  source_directory: "product/development/mock"
  output_directory: "product/release/mock"
  one_page_per_invocation: true
  strict_single_page_execution: true
  batch_or_directory_input_behavior: "stop and ask the user to select exactly one product/development/mock file"
  rationale: "avoid context overflow, hallucination, and inaccurate content"
  filename_rule: "preserve the source mock draft filename relative to product/development/mock"
  content_only: true
  assumption_prefix: "MA"
  confirmation_prefix: "MQ"
  must_apply:
    - "Mock 假设与待确认统一清单"
    - "用户确认状态"
    - "用户确认结果"
    - "Release 处理方式"
    - "all non-empty 用户补充描述 natural-language modifications"
  must_preserve_when_confirmed:
    - "page content overview"
    - "source mapping matrix"
    - "Mermaid content structure"
    - "section-level content table"
    - "element content inventory"
    - "form and option mock content"
    - "list/card/table mock data"
    - "media content descriptions"
    - "state-specific display copy"
    - "visible content mapping from interaction actions"
    - "static versus dynamic source labels"
  must_remove:
    - "MA-/MQ- references"
    - "assumptions and open questions"
    - "draft-only confirmation workflow sections"
    - "raw 用户补充描述 section and notes"
    - "uncertain language"
  must_avoid:
    - "processing more than one mock page per invocation"
    - "reading more than one product/development/mock source page per invocation"
    - "directory-level release inside this single-page skill"
    - "continuing to the next page after one release is completed"
    - "using any source outside product/development/mock as single-page input"
    - "interaction execution logic"
    - "analytics or tracking logic"
    - "API endpoint definitions"
    - "request and response schemas"
    - "backend behavior"
    - "implementation code"
