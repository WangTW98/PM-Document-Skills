name: "product-all-pages-design-release"
version: "0.1.0"
description: "Orchestrate page-by-page generation of all page-level release design Markdown files from release mock pages, the release product overview sitemap, and one selected design system."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "product/release/product-sitemap-release.md"
  - "product/release/mock/<page>.md"
  - "design/<design-system>/DESIGN.md"
  - "design/<design-system>/tokens.json"
  - "design/<design-system>/visual-spec.md"
  - "design/<design-system>/handoff/figma-remote-mcp-guide.md"
outputs:
  - "product/release/design/_generation-status.md"
  - "product/release/design/<page>.md"
  - "product/release/design/<page>.release-blockers.md"
resources:
  references:
    - "references/design-release-generation-status-template.md"
    - "references/design-release-orchestration-quality-checklist.md"
compatibility:
  runner_neutral: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  source_file: "product/release/product-sitemap-release.md"
  source_section: "Sitemap 页面生成总表"
  release_mock_directory: "product/release/mock"
  design_constraint_root: "design"
  design_release_directory: "product/release/design"
  status_file: "product/release/design/_generation-status.md"
  page_design_release_skill: "product-page-design-release"
  sitemap_page_path_source: "页面级MD文件"
  release_mock_path_rule: "use product/release/mock/<same-relative-page-filename>.md as the only valid single-page content source"
  design_release_path_rule: "preserve the product/release/mock relative filename under product/release/design"
  processing_order: "ascending 生成顺序"
  one_page_per_generation_step: true
  requires_selected_design_system: true
  resume_safe: true
  display_only: true
  downstream_target: "Figma Remote MCP"
  must_include:
    - "status queue for every sitemap row"
    - "selected design system tracking"
    - "current page tracking"
    - "completion records"
    - "blocked records with actionable reasons"
    - "page-by-page design release following product-page-design-release"
    - "natural language style description validation"
    - "AI-readable style structure validation"
    - "Figma Remote MCP handoff validation"
    - "layout integrity audit validation for each generated or reused page"
    - "blocked or regeneration status for pages with unresolved stacking, compression, clipping, overlap, hidden-control, hierarchy, or layer-order risks"
  must_avoid:
    - "generating a combined multi-page design release document"
    - "marking pages complete without files"
    - "overwriting completed design release pages without explicit user request"
    - "using page content sources outside product/release/mock"
    - "inventing missing product/release/mock source paths"
    - "auto-selecting among multiple design systems"
    - "editing product/release/product-sitemap-release.md"
    - "editing source files under product/release/mock"
    - "editing selected design system files"
    - "interaction execution logic"
    - "analytics or tracking logic"
    - "API endpoint definitions"
    - "backend behavior"
    - "business process logic"
    - "implementation code"
    - "marking pages complete without layout integrity audit"
    - "marking pages complete with unresolved layout or layer-order risks"
