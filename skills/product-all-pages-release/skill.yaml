name: "product-all-pages-release"
version: "0.4.0"
description: "Orchestrate page-by-page processing for all page drafts in two modes: by default run product-page-release draft revision mode and create versioned draft files; only on explicit final/release request generate release page Markdown files from draft pages and the release product overview sitemap."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "product/release/product-sitemap-release.md"
  - "product/development/pages/<page>.md"
outputs:
  - "product/development/pages/_revision-status.md"
  - "product/development/pages/<page>-v<N>.md"
  - "product/release/pages/_generation-status.md"
  - "product/release/pages/<page>.md"
  - "product/release/pages/<page>.release-blockers.md"
resources:
  references:
    - "references/release-generation-status-template.md"
    - "references/release-orchestration-quality-checklist.md"
compatibility:
  runner_neutral: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  source_file: "product/release/product-sitemap-release.md"
  default_mode: "draft_revision"
  final_release_requires_explicit_user_intent: true
  source_section: "Sitemap 页面生成总表"
  draft_pages_directory: "product/development/pages"
  actual_source_rule: "for each canonical 页面级MD文件, process the highest available versioned sibling when one exists"
  revision_status_file: "product/development/pages/_revision-status.md"
  revision_output_rule: "write next versioned draft beside the source page draft"
  release_pages_directory: "product/release/pages"
  status_file: "product/release/pages/_generation-status.md"
  page_release_skill: "product-page-release"
  draft_page_path_source: "页面级MD文件"
  release_path_rule: "derive release path from canonical 页面级MD文件 by replacing leading product/development/pages with product/release/pages; strip draft revision suffixes from final release filenames"
  processing_order: "ascending 生成顺序"
  one_page_per_release_step: true
  resume_safe: true
  final_release_must_include:
    - "status queue for every sitemap row"
    - "current page tracking"
    - "completion records"
    - "blocked records with actionable reasons"
    - "page-by-page release following product-page-release, including 用户补充描述 application"
    - "analytics event validation for every release page"
  draft_revision_must_include:
    - "status queue for every sitemap row"
    - "page-by-page draft revision following product-page-release draft revision mode"
    - "versioned draft output path for each processed page"
    - "remaining/new PA-/PQ- workflow and empty final 用户补充描述 in revised drafts"
  must_avoid:
    - "generating a combined multi-page release document"
    - "marking pages complete without files"
    - "overwriting completed release pages without explicit user request"
    - "inventing missing draft source paths"
    - "editing product/release/product-sitemap-release.md"
    - "releasing stale draft pages without analytics event statistics"
