interface:
  display_name: "Product All Pages Release"
  short_description: "Revise or finalize all page drafts"
  default_prompt: "Use $product-all-pages-release to read product/release/product-sitemap-release.md and process pages one sitemap row at a time, using each page's latest versioned draft when present. Unless I explicitly ask for final/release/正式版 pages, maintain product/development/pages/_revision-status.md and use product-page-release draft revision mode to create versioned page drafts. Only on explicit final release, maintain product/release/pages/_generation-status.md and generate release page specs under product/release/pages."
