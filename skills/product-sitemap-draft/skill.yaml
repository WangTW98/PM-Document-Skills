name: "product-sitemap-draft"
version: "0.4.0"
description: "Analyze product ideas and source documents, then generate a product overview and complete page-generation sitemap Markdown draft with a final user supplement section."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "natural-language product description"
  - "uploaded or referenced Word documents"
  - "uploaded or referenced PDFs"
  - "uploaded or referenced images, screenshots, mind maps, whiteboard exports, notes, PRDs, or business briefs"
outputs:
  - "product/development/product-sitemap-draft.md"
resources:
  references:
    - "references/product-overview-template.md"
compatibility:
  runner_neutral: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  must_include:
    - "product overview"
    - "complete layout-aware sitemap table with page ID, parent page ID, hierarchy level, generation order, and page-level Markdown path"
    - "Mermaid sitemap visualization that mirrors the canonical sitemap table"
    - "page generation queue for downstream page-level skill calls"
    - "roles and permissions"
    - "key operations"
    - "commercialization, subscription, payment, notification, review, and admin assumptions when relevant"
    - "assumptions and open questions marked inline with stable IDs such as A-001 and Q-001"
    - "final unified assumption and confirmation list that includes every inline A-* and Q-* reference for release generation"
    - "final 用户补充描述 section for user natural-language product and sitemap modifications"
  output_directory: "product/development"
