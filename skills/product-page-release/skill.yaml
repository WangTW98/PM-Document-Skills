name: "product-page-release"
version: "0.6.0"
description: "Process exactly one page draft in two modes: by default apply completed PA-/PQ- decisions and 用户补充描述 into a versioned draft that preserves the review loop; only on explicit final/release request generate the confirmed release page and remove uncertainty."
language: "zh-CN"
entrypoint: "SKILL.md"
type: "project-skill"
inputs:
  - "product/development/pages/<page>.md"
  - "product/development/pages/<page>-v<N>.md"
outputs:
  - "product/development/pages/<page>-v<N>.md"
  - "product/release/pages/<page>.md"
  - "product/release/pages/<page>.release-blockers.md"
resources:
  references:
    - "references/page-release-quality-checklist.md"
compatibility:
  runner_neutral: true
  adapters:
    codex: "adapters/codex/agents/openai.yaml"
    gemini: "adapters/gemini/GEMINI.md"
contract:
  source_skill: "product-page-draft"
  default_mode: "draft_revision"
  final_release_requires_explicit_user_intent: true
  input_directory: "product/development/pages"
  input_selection_rule: "use explicit draft path when provided; if a canonical page draft is named and versioned siblings exist, use the highest version unless the user says to use the exact file"
  output_revision_pattern: "product/development/pages/<source-stem>-v<N>.md"
  output_directory: "product/release/pages"
  one_page_per_invocation: true
  batch_processing_allowed: false
  max_source_pages_per_run: 1
  max_release_pages_per_run: 1
  filename_rule: "final release output uses the canonical page filename under product/release/pages; strip draft revision suffixes like -v2 from release filenames"
  must_apply:
    - "all Release 处理方式 values from the final 页面假设与待确认统一清单"
    - "all user confirmation results that replace, remove, or confirm draft page content"
    - "all non-empty 用户补充描述 natural-language modifications"
  final_release_must_remove:
    - "PA-* and PQ-* references"
    - "page assumptions"
    - "page open questions"
    - "draft-only confirmation lists"
    - "raw 用户补充描述 section and notes"
    - "uncertainty markers"
  draft_revision_must_preserve:
    - "页面假设与待确认统一清单"
    - "PA-* and PQ-* workflow for remaining or new uncertainty"
    - "empty final 用户补充描述 section"
    - "mandatory analytics section and EVT-* event IDs"
    - "review columns for user confirmation and Release handling"
  must_avoid:
    - "processing multiple page draft files in one invocation"
    - "directory-wide release generation"
    - "creating release pages from stale drafts without analytics event statistics"
    - "ignoring non-empty user supplement instructions"
  must_preserve:
    - "confirmed page objective and source metadata"
    - "Mermaid page diagram"
    - "layout section table"
    - "page element inventory"
    - "element state matrix"
    - "interaction action matrix"
    - "analytics event statistics section and EVT-* event IDs"
    - "data structures and API contracts"
    - "boundary states and error handling"
    - "media/resource table when relevant"
